version: '3.9'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tiger_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tiger_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiger_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tiger_intelligence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tiger_user} -d ${POSTGRES_DB:-tiger_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiger_net

  minio:
    image: minio/minio:latest
    container_name: tiger_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiger_net

  minio_init:
    image: minio/mc:latest
    container_name: tiger_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123};
        mc mb --ignore-existing local/${MINIO_BUCKET:-tiger-images};
        mc anonymous set download local/${MINIO_BUCKET:-tiger-images};
        echo 'MinIO initialized';
      "
    networks:
      - tiger_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiger_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tiger_user}:${POSTGRES_PASSWORD:-tiger_pass}@db:5432/${POSTGRES_DB:-tiger_intelligence}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-tiger_user}:${POSTGRES_PASSWORD:-tiger_pass}@db:5432/${POSTGRES_DB:-tiger_intelligence}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-tiger-images}
      - MINIO_SECURE=false
      - ML_MODE=${ML_MODE:-production}
      - REID_CHECKPOINT_PATH=${REID_CHECKPOINT_PATH:-}
      - BLANK_THRESHOLD=${BLANK_THRESHOLD:-0.95}
      - AUTO_MATCH_THRESHOLD=${AUTO_MATCH_THRESHOLD:-0.90}
      - REVIEW_THRESHOLD=${REVIEW_THRESHOLD:-0.75}
      - NEW_INDIVIDUAL_THRESHOLD=${NEW_INDIVIDUAL_THRESHOLD:-0.60}
      - CAMERA_OFFLINE_HOURS=${CAMERA_OFFLINE_HOURS:-48}
      - HIGH_ACTIVITY_DETECTIONS_PER_DAY=${HIGH_ACTIVITY_DETECTIONS_PER_DAY:-5}
      - LOW_CONFIDENCE_THRESHOLD=${LOW_CONFIDENCE_THRESHOLD:-0.80}
      - GEO_DATA_SOURCE=${GEO_DATA_SOURCE:-demo}
      - LOCAL_STORAGE_PATH=/app/storage
      - SECRET_KEY=${SECRET_KEY:-changeme-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./storage:/app/storage
      - ./ml:/app/ml
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - tiger_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tiger_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - tiger_net
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  tiger_net:
    driver: bridge
